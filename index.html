  <body>
    <!-- nav (static — always present, no flash) -->
    <nav id="nav">
      <a href="#hero" class="nav-logo">Usama <span>Bin Sadiq</span></a>
      <ul class="nav-links">

    </nav>

    <!-- mobile menu -->
    <div class="mob-menu" id="mob-menu">

          </div>
        </div>
        <span class="sr-only" role="status">Loading introduction</span>
      </div>
      <div id="slot-about" aria-busy="true">
        <div class="skeleton-section" aria-hidden="true">
          <div class="skeleton-block skeleton-eyebrow"></div>
          <div class="skeleton-block skeleton-heading"></div>
          <div class="skeleton-columns">

      <div id="slot-experience" aria-busy="true">

          <div class="skeleton-block skeleton-eyebrow"></div>

            <div class="skeleton-panel"></div>
            <div class="skeleton-panel"></div>
            <div class="skeleton-panel"></div>
          </div>
        </div>
        <span class="sr-only" role="status">Loading technology section</span>
      </div>
      <div id="slot-contact" aria-busy="true">
        <div class="skeleton-section" aria-hidden="true">

    <footer>
      <span>© <span id="year"></span> Usama Bin Sadiq</span>
      <span>Software Engineer · Islamabad, Pakistan</span>
    </footer>

    <!-- deferred JS -->
    <script src="js/main.js" defer></script>

</html>
